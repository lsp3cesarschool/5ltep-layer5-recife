name: Tests
on:
  push:
    branches: [main]
    paths-ignore: ['docs/data/**', 'results/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test runner (the code itself uses only the standard library)
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests -q
